name: Tests & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck - Bash Script Validation

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        continue-on-error: true
        run: |
          echo "Checking bash scripts for common issues..."
          shellcheck --version

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            shellcheck -x "$file" || true
          done < <(find . -type f -name '*.sh' -print0)

      - name: Detailed shellcheck report
        run: |
          echo "=== SHELLCHECK ANALYSIS ==="
          find . -type f -name '*.sh' -exec shellcheck -f gcc {} \; 2>&1 | tee shellcheck-report.txt || true

          error_count=$(grep -c "error:" shellcheck-report.txt || echo 0)
          warning_count=$(grep -c "warning:" shellcheck-report.txt || echo 0)

          echo ""
          echo "Summary: $error_count errors, $warning_count warnings"

      - name: Upload shellcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report
          path: shellcheck-report.txt

  bash-syntax:
    runs-on: ubuntu-latest
    name: Bash Syntax Validation

    steps:
      - uses: actions/checkout@v4

      - name: Validate bash syntax
        run: |
          echo "=== BASH SYNTAX CHECK ==="
          errors=0

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            if ! bash -n "$file" 2>&1; then
              echo "✗ SYNTAX ERROR in $file"
              ((errors++)) || true
            else
              echo "✓ OK"
            fi
          done < <(find . -type f -name '*.sh' -print0)

          if [ "$errors" -gt 0 ]; then
            echo "Found $errors syntax errors"
            exit 1
          fi
          echo "All scripts have valid syntax ✓"

  python-syntax:
    runs-on: ubuntu-latest
    name: Python Syntax Validation

    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          echo "=== PYTHON SYNTAX CHECK ==="
          errors=0

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            if ! python3 -m py_compile "$file" 2>&1; then
              echo "✗ SYNTAX ERROR in $file"
              ((errors++)) || true
            fi
          done < <(find . -type f -name '*.py' -print0)

          if [ "$errors" -gt 0 ]; then
            echo "Found $errors syntax errors"
            exit 1
          fi
          echo "All Python scripts have valid syntax ✓"

  documentation:
    runs-on: ubuntu-latest
    name: Documentation Check

    steps:
      - uses: actions/checkout@v4

      - name: Check documentation files exist
        run: |
          echo "Checking required documentation files..."

          required_files=(
            "README.md"
            "GETTING-STARTED.md"
            "CHANGELOG.md"
            "QUICK-START.md"
            "TROUBLESHOOTING.md"
          )

          files_checked=0
          files_found=0

          for file in "${required_files[@]}"; do
            files_checked=$((files_checked + 1))
            if [ -f "$file" ]; then
              echo "✓ $file exists"
              files_found=$((files_found + 1))
            else
              echo "⚠ $file not found (non-fatal)"
            fi
          done

          echo "Found $files_found of $files_checked expected documentation files"

      - name: Validate markdown
        run: |
          echo "Checking markdown syntax..."
          while IFS= read -r -d '' file; do
            open_ticks=$(grep -c '\`\`\`' "$file" || echo 0)
            if [ $((open_ticks % 2)) -ne 0 ]; then
              echo "⚠ Unclosed code block in $file"
            fi
          done < <(find . -name "*.md" -type f -print0)
          echo "Markdown validation complete ✓"

  project-structure:
    runs-on: ubuntu-latest
    name: Script Functionality Tests

    steps:
      - uses: actions/checkout@v4

      - name: Test script help output
        run: |
          echo "=== TESTING SCRIPT HELP OUTPUT ==="

          while IFS= read -r -d '' script; do
            echo "Testing: $(basename "$script")"
            if grep -q "help\|--help\|-h" "$script"; then
              echo "✓ Help documentation found"
            else
              echo "⚠ No help text in $(basename "$script")"
            fi
          done < <(find tools scripts reaper-config wine-config -maxdepth 1 -name '*.sh' -print0 2>/dev/null || true)

      - name: Test script validation
        run: |
          echo "=== TESTING SCRIPT VALIDATION ==="

          while IFS= read -r -d '' script; do
            if grep -q "set -e\|set -euo pipefail" "$script"; then
              echo "✓ $(basename "$script") has error handling"
            else
              echo "⚠ $(basename "$script") missing error handling"
            fi
          done < <(find installer scripts reaper-config tools wine-config -maxdepth 1 -name '*.sh' -print0 2>/dev/null || true)

  config-validation:
    runs-on: ubuntu-latest
    name: Configuration Files Validation

    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration files
        run: |
          echo "=== CONFIGURATION FILES CHECK ==="

          if [ -f "config/asoundrc.template" ]; then
            echo "✓ asoundrc.template exists"
          fi

          if [ -d "reaper-config" ]; then
            echo "✓ REAPER config directory exists"
            ls -la reaper-config/ | head -10
          fi

          if [ -f ".gitignore" ]; then
            echo "✓ .gitignore exists"
          fi

  cross-reference:
    runs-on: ubuntu-latest
    name: Cross-Reference Integrity

    steps:
      - uses: actions/checkout@v4

      - name: Check for broken references
        run: |
          echo "=== CROSS-REFERENCE CHECK ==="
          errors=0

          while IFS= read -r -d '' script; do
            while IFS= read -r line; do
              # Skip dynamic paths (containing variables)
              if echo "$line" | grep -qP '\$\{?\w+' 2>/dev/null; then
                continue
              fi
              ref=$(echo "$line" | grep -oP 'source "\K[^"]+' || echo "")
              if [ -n "$ref" ] && [ ! -f "$ref" ]; then
                echo "✗ Broken source reference: $ref (in $script)"
                ((errors++)) || true
              fi
            done < <(grep '^source ' "$script" 2>/dev/null || true)
          done < <(find . -type f -name '*.sh' -print0)

          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken references"
            exit 1
          fi
          echo "✓ All cross-references valid"

  summary:
    runs-on: ubuntu-latest
    name: Test Summary
    if: always()
    needs: [shellcheck, bash-syntax, python-syntax, documentation, project-structure, config-validation, cross-reference]

    steps:
      - name: Print summary
        run: |
          echo "=== CI/CD TEST SUMMARY ==="
          echo "ShellCheck: ${{ needs.shellcheck.result }}"
          echo "Bash Syntax: ${{ needs.bash-syntax.result }}"
          echo "Python Syntax: ${{ needs.python-syntax.result }}"
          echo "Documentation: ${{ needs.documentation.result }}"
          echo "Project Structure: ${{ needs.project-structure.result }}"
          echo "Config Validation: ${{ needs.config-validation.result }}"
          echo "Cross-Reference: ${{ needs.cross-reference.result }}"
          echo ""
          echo "Run details: https://github.com/devfrp/REAPER-OS/actions/runs/${{ github.run_id }}"
