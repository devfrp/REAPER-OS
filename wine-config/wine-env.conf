# REAPER OS Wine Environment Configuration
# Charge par start-reaper.sh

export WINEARCH=win64
export WINEPREFIX="${WINEPREFIX:-$HOME/.wine}"
export WINEDLLOVERRIDES="mscoree,mshtml="

# VST paths
export VST_PATH="${VST_PATH:-$WINEPREFIX/drive_c/Program Files/Steinberg/VSTPlugins}"
export VST3_PATH="${VST3_PATH:-$WINEPREFIX/drive_c/Program Files/Common Files/VST3}"

# ASNUX low-latency audio engine
export ASNUX_SOCKET="/tmp/asnux-daemon.sock"
export ASNUX_BUFFER="${ASNUX_BUFFER:-256}"
export ASNUX_RATE="${ASNUX_RATE:-48000}"
export ASNUX_CHANNELS="${ASNUX_CHANNELS:-2}"
export ASNUX_PERIODS="${ASNUX_PERIODS:-4}"

# AudioGridder
export AUDIOGRIDDER_PATH="${AUDIOGRIDDER_PATH:-$WINEPREFIX/drive_c/Program Files/AudioGridder}"

# REAPER
export REAPER_EXE="$WINEPREFIX/drive_c/Program Files/REAPER/reaper.exe"
